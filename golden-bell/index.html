<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18213D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="골든벨 30">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Golden Bell Daily 30</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
</head><body>

<style>
/* Layout: one narrow column like a contestant's answer board on a quiz stage; brass bell = reward, navy marker = text */
:root{
  --bg:#E9EDF5; --board:#FFFFFF; --ink:#18213D; --muted:#5B6480; --line:#D3D9E6;
  --brass:#A8761C; --brass-soft:#F4E7C6; --brass-ink:#5A3E08;
  --ok:#1E8556; --ok-soft:#DDF2E7; --bad:#C2352B; --bad-soft:#FBE2DF;
  --shadow:0 1px 0 rgba(24,33,61,.06),0 6px 18px rgba(24,33,61,.08); --stage:#18213D; --stage-fg:#FFFFFF;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Atkinson Hyperlegible","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1428; --board:#1A2142; --ink:#E9EDF8; --muted:#9AA3C0; --line:#2B3560;
  --brass:#E2B456; --brass-soft:#3A3018; --brass-ink:#F6DE9F;
  --ok:#4BC58C; --ok-soft:#173A2B; --bad:#F2695E; --bad-soft:#44201E;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --stage:#252E5A; --stage-fg:#EEF1FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1428; --board:#1A2142; --ink:#E9EDF8; --muted:#9AA3C0; --line:#2B3560;
  --brass:#E2B456; --brass-soft:#3A3018; --brass-ink:#F6DE9F;
  --ok:#4BC58C; --ok-soft:#173A2B; --bad:#F2695E; --bad-soft:#44201E;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --stage:#252E5A; --stage-fg:#EEF1FA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px}
.brand svg{width:28px;height:28px}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 11px;border-radius:999px;background:var(--board);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.brass{background:var(--brass-soft);border-color:transparent;color:var(--brass-ink)}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.iconbtn:hover{background:var(--board)}

/* surfaces */
.card{background:var(--board);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--ink);color:var(--board)}
.btn.brass{background:var(--brass);color:#fff}
:root[data-theme="dark"] .btn.brass{color:#1A1200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.brass{color:#1A1200}}
.btn.ghost{border:1.5px solid var(--line);background:var(--board)}
.btn.danger{color:var(--bad);border:1.5px solid var(--bad);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--board);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;min-height:42px;padding:6px 10px;border-radius:10px;font-weight:500;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--board)}

/* students */
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stu{background:var(--board);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px}
.stu:hover{border-color:var(--brass)}
.stu .av{font-size:34px;line-height:1}
.stu b{font-size:18px}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.avatars button{width:46px;height:46px;font-size:26px;border-radius:12px;border:1.5px solid var(--line);background:var(--board)}
.avatars button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.input{min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--board);font-size:16px;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--board);font-size:14px;line-height:1.2;padding:4px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--board)}

/* dashboard hero: the stage */
.stage{background:var(--stage);color:var(--stage-fg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.stage .who{display:flex;align-items:center;gap:12px}
.stage .who .av{font-size:42px;line-height:1}
.stage .title{color:var(--brass);font-size:14px;font-weight:700;letter-spacing:.04em}
.stage .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage .stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px}
.stage .stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1.1}
.stage .stat span{font-size:12px;opacity:.75}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder div{border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.25;border:1px solid rgba(255,255,255,.18);opacity:.6}
.ladder div b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px}
.ladder .done{opacity:.85}
.ladder .now{opacity:1;background:var(--brass);color:#1A1200;border-color:var(--brass)}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.14);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brass)}
.meter em{position:absolute;left:80%;top:-4px;bottom:-4px;width:2px;background:var(--stage-fg)}
.ctas{display:grid;grid-template-columns:1fr;gap:10px}

/* quiz */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--brass)}
.board{background:var(--board);border:2px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}
.qtext{font-family:var(--f-en);font-size:22px;line-height:1.4;font-weight:700}
.qmeta{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--board);font-family:var(--f-en);font-size:18px}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.answerboard{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.answerboard input{font-family:var(--f-en);font-size:24px;font-weight:700;min-height:60px;padding:10px 16px;border-radius:14px;border:2px solid var(--ink);background:var(--board);width:100%;letter-spacing:.02em}
.answerboard input.right{border-color:var(--ok)} .answerboard input.wrong{border-color:var(--bad)}
.rule{font-size:13px;color:var(--muted)}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb .v{font-family:var(--f-display);font-size:20px}
.fb.ok .v{color:var(--ok)} .fb.no .v{color:var(--bad)}
.fb .ans{font-family:var(--f-en);font-size:18px;font-weight:700}
.diff span{border-radius:3px} .diff .x{background:var(--bad);color:#fff}
.combo{color:var(--brass);font-weight:700}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:13px;min-height:36px;padding:0 4px;align-self:flex-start}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);font-weight:500}

/* result */
.bigscore{font-family:var(--f-display);font-size:64px;line-height:1}
.bell-anim svg{width:84px;height:84px;transform-origin:50% 8%;animation:ring 1.2s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){.bell-anim svg{animation:none}}
.lvup{background:var(--brass-soft);color:var(--brass-ink);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.lines{display:flex;flex-direction:column}
.lines>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.lines>div:last-child{border-bottom:0}

/* lists */
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{background:var(--board);border:1px solid var(--line);border-radius:14px;padding:14px}
.qitem .q{font-family:var(--f-en);font-weight:700}
.qitem .a{font-family:var(--f-en);color:var(--ok);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--board);display:flex;flex-direction:column;gap:2px}
.badge .ic{font-size:28px;line-height:1.1}
.badge.off{opacity:.42;filter:grayscale(1)}
.badge b{font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:72px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--board)}
.levels b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.notice{border-radius:12px;padding:12px 14px;background:var(--brass-soft);color:var(--brass-ink);font-size:14px}
.genlog{font-size:14px;min-height:22px}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--board);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:420px){h1{font-size:26px}.qtext{font-size:20px}.stage .stat b{font-size:20px}.levels b{font-size:18px}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Golden Bell question bank
   [level, category, type('m'=4지선다,'s'=단답형), question, answer('|'로 다른 정답 허용), options(사지선다만), 한국어 해설]
   단답형 규칙: 고유명사는 대문자로 시작, 일반 단어는 소문자, 숫자는 아라비아 숫자, a/an/the 없이 */
var BANK = [
/* ===== 시사 상식 cur ===== */
[1,'cur','m','What does "UN" stand for?','United Nations',['United Nations','Universal Network','United Nature','Union of Nations'],'UN은 국제연합(유엔)이에요. 1945년에 세계 평화를 지키려고 만들어졌어요.'],
[1,'cur','m','Which gas, made when we burn oil and coal, is a main cause of global warming?','carbon dioxide',['carbon dioxide','oxygen','helium','nitrogen'],'석유·석탄을 태우면 이산화탄소(carbon dioxide)가 나와서 지구를 덥게 해요.'],
[1,'cur','m','Which K-pop group sang "Dynamite" in 2020?','BTS',['BTS','BLACKPINK','TWICE','EXO'],'BTS의 "Dynamite"는 2020년 미국 빌보드 핫100 1위에 올랐어요.'],
[1,'cur','s','What do we call collecting used paper, cans and bottles so they can be made into new things?','recycling','재활용은 recycling이에요. recycle(재활용하다)의 -ing 형태예요.'],
[1,'cur','s','What is the name of the money used in South Korea?','won','한국 돈의 단위는 원(won)이에요. 일반 단어라 소문자로 써요.'],
[1,'cur','s','What is the name of the money used in the United States?','dollar','미국 돈은 달러(dollar)예요.'],
[1,'cur','s','Which big white Arctic animal is in danger because sea ice is melting?','polar bear','북극곰은 polar bear예요. 바다 얼음이 녹아서 사냥이 어려워지고 있어요.'],
[1,'cur','s','What do we call energy made from sunlight? (two words)','solar energy|solar power','태양 에너지는 solar energy(또는 solar power)예요.'],
[1,'cur','s','What does "AI" stand for? (two words)','artificial intelligence','AI는 인공지능, artificial intelligence의 줄임말이에요.'],
[1,'cur','s','What is the name of the big sports event held every four years, in summer and in winter?','Olympics|Olympic Games','올림픽(Olympics)은 하계·동계로 4년마다 열려요. 고유명사라 대문자로 시작해요.'],

[2,'cur','m','The 2026 FIFA World Cup was hosted by the USA, Canada and which other country?','Mexico',['Mexico','Brazil','Japan','England'],'2026 월드컵은 미국·캐나다·멕시코 세 나라가 함께 열었어요. 처음으로 48개 팀이 참가했어요.'],
[2,'cur','m','The SDGs (Sustainable Development Goals) were made by which organization?','United Nations',['United Nations','FIFA','NASA','Red Cross'],'지속가능발전목표(SDGs)는 2015년 유엔이 정했어요.'],
[2,'cur','m','What does "carbon neutral" mean?','putting out no more carbon than you take away',['putting out no more carbon than you take away','using only coal for energy','planting no trees at all','making more plastic every year'],'탄소 중립은 내보내는 탄소만큼 다시 없애서 합계를 0으로 만드는 거예요.'],
[2,'cur','s','Which country won the 2026 FIFA World Cup?','Spain','2026년 7월 19일 결승에서 스페인이 아르헨티나를 1대 0으로 이겼어요.'],
[2,'cur','s','In which city were the 2024 Summer Olympics held?','Paris','2024년 하계 올림픽은 프랑스 파리에서 열렸어요.'],
[2,'cur','s','Which American city will host the 2028 Summer Olympics? (two words)','Los Angeles','2028년 하계 올림픽은 미국 로스앤젤레스(Los Angeles)에서 열려요.'],
[2,'cur','s','The 2015 world agreement to fight climate change is named after a city. What is it called? (two words)','Paris Agreement|Paris Climate Agreement','파리 협정(Paris Agreement)은 2015년에 맺은 기후 변화 협약이에요.'],
[2,'cur','s','How many goals are there in the UN\'s SDGs? (number)','17','유엔 지속가능발전목표는 모두 17개예요.'],
[2,'cur','s','What do we call a long time with little or no rain?','drought','가뭄은 drought예요. 기후 변화로 더 자주 생기고 있어요.'],
[2,'cur','s','In which country were the 2026 Asian Games held?','Japan','2026년 아시안게임은 일본 아이치·나고야에서 열렸어요.'],

[3,'cur','m','In 2026, the Nobel Prize in Literature went to Anne Carson. Which country is she from?','Canada',['Canada','Australia','Ireland','Sweden'],'2026년 노벨 문학상은 캐나다의 시인 앤 카슨이 받았어요.'],
[3,'cur','m','The 2026 Winter Olympics were held in Milan and Cortina. Which country is that?','Italy',['Italy','France','Switzerland','Austria'],'2026 동계 올림픽은 이탈리아 밀라노·코르티나에서 열렸어요.'],
[3,'cur','m','What does "ESG" stand for in business?','Environmental, Social and Governance',['Environmental, Social and Governance','Energy, Science and Growth','Economy, Safety and Government','Education, Sports and Games'],'ESG는 환경(E)·사회(S)·지배구조(G)예요. 기업이 책임 있게 경영하는지 보는 기준이에요.'],
[3,'cur','s','Navi Pillay won the 2026 Nobel Peace Prize. In which country was she born? (two words)','South Africa','나비 필레이는 남아프리카공화국 더반에서 태어난 인권 법률가예요.'],
[3,'cur','s','Which country lost to Spain in the 2026 World Cup final?','Argentina','2026 월드컵 결승에서 아르헨티나가 스페인에 0대 1로 졌어요.'],
[3,'cur','s','What is the three-letter short name of the UN agency for world health?','WHO','세계보건기구는 World Health Organization, 줄여서 WHO예요.'],
[3,'cur','s','In "G20", what does the "G" stand for?','Group','G20은 Group of Twenty, 주요 20개국 모임이에요.'],
[3,'cur','s','Microplastics are tiny pieces of what material?','plastic','미세플라스틱은 아주 작은 플라스틱(plastic) 조각이에요.'],
[3,'cur','s','What do we call money that exists only online, like Bitcoin?','cryptocurrency','비트코인 같은 디지털 화폐를 암호화폐, cryptocurrency라고 해요.'],
[3,'cur','s','What do we call the rise in Earth\'s average temperature? (two words)','global warming','지구 온난화는 global warming이에요.'],

function buildSet(st,level){
  var pool = allQ().filter(function(q){return q.l===level && !S.excluded[q.id]});
  function key(q){var s=st.seen[q.id]; return s ? (s.n*1e13 + s.last + Math.random()) : (Math.random()-2)}
  var keyed = pool.map(function(q){return {q:q,k:key(q)}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.q});
  var cells={}; keyed.forEach(function(q){var k=q.c+q.t;(cells[k]=cells[k]||[]).push(q)});
  var picked=[], used={};
  function take(c,t){var arr=cells[c+t]; while(arr&&arr.length){var q=arr.shift(); if(!used[q.id]){used[q.id]=1;picked.push(q);return true}} return false}
  function count(t){return picked.filter(function(q){return q.t===t}).length}
  setPlan().forEach(function(p){for(var i=0;i<p.m;i++)take(p.c,'m');for(i=0;i<p.s;i++)take(p.c,'s')});
  function fill(t,limit){var rest=keyed.filter(function(q){return !used[q.id] && (!t||q.t===t)});

/* 역사·문학·문화 4문제씩(2+2), 나머지 7개 분야 중 4개는 3문제, 3개는 2문제 → 30문제, 사지선다 15 · 단답형 15 */
function setPlan(){
  var plan=MAJOR.map(function(c){return {c:c,m:2,s:2}});
  var others=shuffle(CAT_KEYS.filter(function(c){return MAJOR.indexOf(c)<0}));
  var flip=shuffle([0,0,1,1]);
  others.forEach(function(c,i){
    if(i<4) plan.push(flip[i]?{c:c,m:2,s:1}:{c:c,m:1,s:2});
    else plan.push({c:c,m:1,s:1});
  });
  return plan;
}

/* ---------- grading ---------- */
/* 'exact' = 글자 그대로 일치, 'case' = 보통 단어인데 대소문자만 다름(정답 인정 + 오답 노트), false = 오답.
   고유명사(정답이 대문자로 시작)와 숫자·기호 답은 글자 그대로 맞아야 해요. */
function isProper(q){return /^[A-Z]/.test(q.a[0])}
function gradeSA(q,given){
  var g=given.replace(/^\s+|\s+$/g,'');
  if(q.a.indexOf(g)>=0)return 'exact';
  if(!isProper(q)&&/[a-z]/i.test(g)){
    var lg=g.toLowerCase();
    for(var i=0;i<q.a.length;i++){if(!/^[A-Z]/.test(q.a[i])&&q.a[i].toLowerCase()===lg)return 'case'}
  }
  return false;
}
function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function hintFor(q,given){
  var g=given.trim(), a=q.a[0];
  if(!g) return '답을 쓰지 않았어요.';
  for(var i=0;i<q.a.length;i++){ if(q.a[i].toLowerCase()===g.toLowerCase()) return '철자는 맞지만 대문자·소문자가 달라요. 사람·나라·도시 같은 고유명사는 대문자까지 정확해야 정답이에요.'; }
  if(/^(the|a|an) /i.test(g)) return 'a / an / the 없이 써야 해요.';
  var best=99; q.a.forEach(function(x){best=Math.min(best,lev(x.toLowerCase(),g.toLowerCase()))});
  if(best<=2) return '거의 맞았어요! 철자가 '+best+'글자 달라요.';
  return '';
}

/* ---------- speech ---------- */
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(function(v){return /^en[-_]/i.test(v.lang)})}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices(); try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function bestVoice(){
  if(S.voice){for(var i=0;i<voices.length;i++){if(voices[i].name===S.voice)return voices[i]}}
  var us=voices.filter(function(v){return /en[-_]US/i.test(v.lang)}); var list=us.length?us:voices;
  var good=list.filter(function(v){return /(natural|neural|premium|enhanced|향상|google)/i.test(v.name)});
  return good[0]||list[0]||null;
}
function speak(text){
  if(!('speechSynthesis' in window)){toast('이 기기에서는 읽어 주기를 쓸 수 없어요.');return}
  try{speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.replace(/\((.*?)\)/g,'. $1')); var v=bestVoice(); if(v){u.voice=v;u.lang=v.lang}else{u.lang='en-US'} u.rate=0.92; speechSynthesis.speak(u)}catch(e){}
}

/* ---------- DOM helper ---------- */
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v; else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v)}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,c){if(c==null||c===false)return; if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return} e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)}
var app=document.getElementById('app');
function mount(){app.innerHTML='';for(var i=0;i<arguments.length;i++)add(app,arguments[i]);window.scrollTo(0,0)}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}
function bell(){var s=h('span');s.innerHTML=BELL_SVG;return s.firstChild}

/* ---------- quiz ---------- */
function startSet(kind){
  var st=stu(); var ids=buildSet(st,st.level);
  if(ids.length<10){toast('이 난이도의 문제가 부족해요. 문제 만들기 탭에서 새 문제를 만들어 주세요.');return}
  st.cur={date:today(),kind:kind,level:st.level,ids:ids,i:0,ans:[],combo:0,maxCombo:0,pts:0,done:false};
  save(); quiz();
}

function quiz(){
  var st=stu(), cur=st.cur; if(!cur)return dash();
  if(cur.i>=cur.ids.length)return finishSet();
  var q=qById(cur.ids[cur.i]);
  if(!q){cur.ids.splice(cur.i,1);save();return quiz()}
  renderQuestion({
    st:st,q:q,idx:cur.i,total:cur.ids.length,level:cur.level,combo:cur.combo,label:cur.kind==='daily'?'오늘의 30문제':'추가 세트',
    onAnswer:function(ok,given,note){
      var pts=0;
      if(ok){cur.combo++; cur.maxCombo=Math.max(cur.maxCombo,cur.combo); pts=BASE[cur.level]+(q.t==='s'?5:0)+(cur.combo>=3?5:0)}
      else{cur.combo=0}
      if(!ok||note==='case'){var w=st.wrong[q.id]; st.wrong[q.id]={n:(w?w.n:0)+1,d:today(),caseOnly:ok}}
      cur.pts+=pts; st.points+=pts;
      cur.ans.push({id:q.id,ok:ok,given:given,pts:pts,near:note==='case'});
      var s=st.seen[q.id]; st.seen[q.id]={n:(s?s.n:0)+1,last:Date.now()};
      var c=st.cat[q.c]||{ok:0,n:0}; c.n++; if(ok)c.ok++; st.cat[q.c]=c;
      st.bestCombo=Math.max(st.bestCombo||0,cur.combo);
      save(); return {pts:pts,combo:cur.combo};
    },
    onNext:function(){cur.i++;save();quiz()},
    onQuit:function(){dash()}
  });
}

function renderQuestion(o){
  var q=o.q, answered=false;
  var fbBox=h('div');
  var head=h('div',{class:'qhead'},
    h('span',{class:'chip num'},(o.idx+1)+' / '+o.total),
    h('span',{class:'chip'},'Lv'+o.level+' '+LV[o.level].name),
    h('span',{class:'chip'},CATS[q.c]),
    o.combo>=2?h('span',{class:'chip brass'},'🔥 '+o.combo+'연속'):null);
  var qtext=h('p',{class:'qtext',lang:'en'},q.q);
  var meta=h('div',{class:'qmeta'},
    h('button',{class:'btn ghost',style:'min-height:40px;padding:6px 12px',onclick:function(){speak(q.q)},'aria-label':'문제 읽어 주기'},'🔊 듣기'),
    h('span',{class:'tag'},q.t==='m'?'사지선다':'단답형 · '+wordHint(q)),
    q.src==='claude'?h('span',{class:'tag'},'Claude가 만든 문제'):null);
  var area;
  function done(ok,given,note){
    if(answered)return; answered=true;
    var r=o.onAnswer(ok,given,note);
    fbBox.appendChild(feedback(q,ok,given,r,o,note));
    var nb=fbBox.querySelector('.next'); if(nb)nb.focus();
  }
  if(q.t==='m'){
    var letters='ABCD', opts=shuffle(q.o.slice());
    area=h('div',{class:'opts'},opts.map(function(op,i){
      return h('button',{class:'opt',lang:'en',onclick:function(e){
        var ok=op===q.a[0];
        [].forEach.call(area.children,function(b,j){b.disabled=true; if(opts[j]===q.a[0])b.classList.add('right')});
        if(!ok)e.currentTarget.classList.add('wrong');
        done(ok,op);
      }},h('span',{class:'k'},letters[i]),h('span',{},op));
    }));
  } else {
    var inp=h('input',{id:'sa',type:'text',autocapitalize:'off',autocomplete:'off',autocorrect:'off',spellcheck:'false',enterkeyhint:'done',placeholder:'영어로 답을 써요','aria-label':'답 쓰기',lang:'en'});
    var sub=h('button',{class:'btn primary block',type:'submit'},'정답 확인');
    area=h('form',{class:'answerboard',onsubmit:function(e){e.preventDefault(); if(answered)return;
        if(!inp.value.trim()){inp.focus();toast('답을 쓰고 눌러 주세요. 모르면 "모르겠어요"를 눌러요.');return}
        var gr=gradeSA(q,inp.value), ok=!!gr; inp.readOnly=true; inp.classList.add(ok?'right':'wrong'); sub.disabled=true; skip.disabled=true; done(ok,inp.value,gr==='case'?'case':null)}},
      inp,
      h('p',{class:'rule'},'고유명사는 대문자까지 정확히 · 보통 단어는 대소문자 상관없이 철자만 정확히 · 숫자는 숫자로 · a/an/the 없이'),
      sub);
    var skip=h('button',{class:'linkbtn',type:'button',onclick:function(){if(answered)return;inp.readOnly=true;sub.disabled=true;skip.disabled=true;done(false,'')}},'모르겠어요');
    area.appendChild(skip);
    setTimeout(function(){try{inp.focus({preventScroll:true})}catch(e){}},50);
  }
  mount(topbar(o.st,o.onQuit),head,
    h('div',{class:'progress'},h('i',{style:'width:'+Math.round(o.idx/o.total*100)+'%'})),
    h('div',{class:'board'},qtext,meta,area,fbBox));
}
function wordHint(q){var n=q.a[0].split(/\s+/).length; if(/English words/.test(q.q))return '숫자를 영어 단어로'; if(/^-?[\d.,−-]+$/.test(q.a[0]))return '숫자'; return n===1?'1단어':n+'단어'}

function diffView(given,ans){
  var w=h('span',{class:'diff'});
  for(var i=0;i<Math.max(given.length,ans.length);i++){
    var ch=given[i]; if(ch===undefined)break;
    w.appendChild(h('span',{class:ch!==ans[i]?'x':''},ch===' '?' ':ch));
  }
  return w;
}

/* ---------- finish ---------- */
function finishSet(){
  var st=stu(), cur=st.cur, t=today();
  var correct=cur.ans.filter(function(a){return a.ok}).length, total=cur.ans.length;
  var saCorrect=cur.ans.filter(function(a){var q=qById(a.id);return a.ok&&!a.near&&q&&q.t==='s'}).length;
  var saTotal=cur.ans.filter(function(a){var q=qById(a.id);return q&&q.t==='s'}).length;
  var pct=total?correct/total:0, bonus=[], newB=[];
  if(pct>=PASS)bonus.push(['정답률 80% 이상',30]);
  if(correct===total&&total>=SET_SIZE)bonus.push(['퍼펙트',100]);
  var firstToday = st.lastDay!==t;
  if(firstToday){
    st.streak = st.lastDay===yesterday()? st.streak+1 : 1; st.lastDay=t; bonus.push(['오늘 출석',10]);
  }
  if(cur.kind==='daily')st.dailyDone=t;
  var bsum=bonus.reduce(function(s,b){return s+b[1]},0); st.points+=bsum;
  var up=false, fromLv=cur.level;
  if(pct>=PASS && cur.level===st.level && st.level<4){st.level++;up=true}
  function award(id){if(!st.badges[id]){st.badges[id]=t;newB.push(id)}}
  award('first');
  if(correct===total&&total>=SET_SIZE)award('perfect');
  if(saTotal>=SA_N&&saCorrect===saTotal)award('spell21');
  if(cur.maxCombo>=10)award('combo10');
  if(st.streak>=3)award('streak3'); if(st.streak>=7)award('streak7'); if(st.streak>=30)award('streak30');
  if(st.level>=2)award('lv2'); if(st.level>=3)award('lv3'); if(st.level>=4)award('lv4');
  if(cur.level===4&&pct>=PASS)award('bell');
  for(var c in st.cat){if(st.cat[c].ok>=30)award('cat30')}
  st.history.push({date:t,level:cur.level,correct:correct,total:total,points:cur.pts+bsum,kind:cur.kind,up:up});
  st.last={correct:correct,total:total,pct:pct,setPts:cur.pts,bonus:bonus,up:up,from:fromLv,to:st.level,newB:newB,wrongIds:cur.ans.filter(function(a){return !a.ok}).map(function(a){return a.id}),level:cur.level};
  cur.done=true; save();
  result();
}

var RV=null;
function startReview(ids){
  var st=stu(); var list=(ids||Object.keys(st.wrong)).filter(function(id){return st.wrong[id]&&qById(id)});
  if(!list.length){toast('다시 풀 오답이 없어요.');return}
  RV={ids:shuffle(list.slice()),i:0,ok:0,pts:0,combo:0};
  review();
}
function review(){
  var st=stu();
  if(RV.i>=RV.ids.length){
    var n=RV.ids.length;
    if(st.cleared>=10)award2(st,'review10'); if(st.cleared>=50)award2(st,'review50'); save();
    mount(topbar(st,function(){tab='wrong';dash()}),h('div',{class:'stack'},
      h('div',{class:'card stack',style:'text-align:center;align-items:center'},h('p',{class:'muted'},'오답 다시 풀기 결과'),h('div',{class:'bigscore num'},RV.ok+' / '+n),
        h('p',{},'맞힌 '+RV.ok+'문제는 오답 노트에서 졸업했어요. +'+RV.pts+'점')),
      Object.keys(st.wrong).length?h('button',{class:'btn brass block',onclick:function(){startReview(null)}},'남은 오답 '+Object.keys(st.wrong).length+'문제 또 풀기'):h('p',{class:'notice'},'오답 노트가 비었어요. 멋져요!'),
      h('button',{class:'btn primary block',onclick:function(){tab='today';dash()}},'처음 화면으로')));
    return;
  }
  var q=qById(RV.ids[RV.i]);
  renderQuestion({st:st,q:q,idx:RV.i,total:RV.ids.length,level:q.l,combo:RV.combo,review:true,
    onAnswer:function(ok,given,note){
      var pts=0;
      if(ok&&note==='case'){RV.combo=0}
      else if(ok){RV.ok++;RV.combo++;pts=5;delete st.wrong[q.id];st.cleared=(st.cleared||0)+1}
      else{RV.combo=0;var w=st.wrong[q.id]||{n:0};w.n++;w.d=today();st.wrong[q.id]=w}
      RV.pts+=pts; st.points+=pts; save(); return {pts:pts,combo:0};
    },
    onNext:function(){RV.i++;review()},
    onQuit:function(){tab='wrong';dash()}});
}

function buildPrompt(level){
  var existing=allQ().filter(function(q){return q.l===level}).map(function(q){return '- '+q.q.slice(0,90)}).slice(-220).join('\n');
  return 'You are writing quiz questions for Korean students in grade 6 of elementary school and grade 1 of middle school who are preparing for an English "Golden Bell" general-knowledge quiz contest.\n'+
  'Write exactly 30 NEW questions for difficulty level '+level+' of 4: '+LV_EN[level]+'.\n'+
  'Mix: exactly 15 multiple-choice questions and exactly 15 short-answer questions. his, lit and cul get 4 questions each (2 multiple-choice + 2 short-answer). The other 7 categories get 2 or 3 questions each.\n'+
  'Categories (use these codes): cur = current affairs and world issues, lit = literature (authors, famous books, poems, myths and literary terms; make these about one level harder than the other categories), his = history (Korean and world), cul = culture (holidays, festivals, food, customs, heritage sites, Korean and world culture), sci = science, mat = math, art = art and music, spo = sports, geo = geography, peo = famous people.\n'+
  'Rules:\n'+
  '- Simple, clear English for this level. Exactly one correct answer. Use only facts that are certain and well established; skip anything you are not sure about. For cur, use stable, widely known facts, say the year in the question, and avoid predictions or very recent news.\n'+
  '- Short answers must be 1 to 3 words, written exactly as they must be spelled. No "a", "an" or "the". Proper nouns start with a capital letter (Paris, Jupiter); ordinary words are all lowercase (gravity, honey); numbers use digits (17), EXCEPT in mat: every numeric math answer is written in English words, lowercase, with hyphens (forty-two, three hundred sixty), and you add the other usual forms to "alts" (forty two, three hundred and sixty); end those math questions with "(write the answer in English words)". If a different spelling is equally correct, add it to "alts". When the expected form is not obvious, end the question with a hint in parentheses such as (full name), (last name), (two words) or (number).\n'+
  '- Multiple choice: exactly 4 different options; "answer" must be exactly one of them; wrong options should be plausible.\n'+
  '- "ex": one or two short sentences in Korean, polite 해요체 style, explaining the answer to a child (include the Korean name of the answer).\n'+
  '- Do not repeat or closely copy these existing questions:\n'+existing+'\n\n'+
  'Reply with only a JSON array of 30 objects like {"cat":"sci","type":"short","q":"Which planet is known as the Red Planet?","answer":"Mars","alts":[],"options":[],"ex":"붉은 행성은 화성(Mars)이에요."}. Use "type":"mc" with 4 "options" for multiple choice.';
}

function validate(items,level){
  var have={}; allQ().forEach(function(q){have[q.q.toLowerCase().replace(/\W+/g,'')]=1});
  var out=[];
  (Array.isArray(items)?items:[]).forEach(function(x){
    if(!x||typeof x!=='object')return;
    var c=String(x.cat||''), t=x.type==='mc'?'m':x.type==='short'?'s':'', q=String(x.q||'').trim(), a=String(x.answer||'').trim(), e=String(x.ex||'').trim();
    if(!CATS[c]||!t||q.length<8||!a||!e)return;
    var k=q.toLowerCase().replace(/\W+/g,''); if(have[k])return;
    var obj={id:'g'+hash(q),l:level,c:c,t:t,q:q,a:[a],o:null,e:e,src:'claude',added:today()};
    if(t==='m'){var o=(x.options||[]).map(function(s){return String(s).trim()}).filter(Boolean);
      if(o.length!==4||o.indexOf(a)<0||new Set(o).size!==4)return; obj.o=o;}
    else{ if(a.split(/\s+/).length>(c==='mat'?7:4)||/^(the|a|an)\s/i.test(a))return;
      (x.alts||[]).forEach(function(s){s=String(s).trim(); if(s&&obj.a.indexOf(s)<0&&!/^(the|a|an)\s/i.test(s))obj.a.push(s)}); }
    have[k]=1; out.push(obj);
  });
  return out;
}

function generate(level,go,stop,log){
  genCtl=new AbortController(); go.disabled=true; stop.hidden=false;
  log.textContent='Claude가 생각하는 중이에요… (1~2분 걸려요)';
  var prompt=buildPrompt(level);
  var p;
  if(sampleFn){
    p=sampleFn.json(prompt,{signal:genCtl.signal,cache:false,onText:function(u){var n=(u.text.match(/"q"\s*:/g)||[]).length;log.textContent='문제를 쓰는 중이에요… '+n+' / 30'}});
  } else {
    p=fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:genCtl.signal,
      headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:16000,messages:[{role:'user',content:prompt}]})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw {code:'api',message:(j&&j.error&&j.error.message)||('HTTP '+r.status)};return j})})
    .then(function(j){var txt=(j.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
      var s=txt.indexOf('['),e=txt.lastIndexOf(']'); if(s<0||e<0)throw {code:'invalid_json'}; return JSON.parse(txt.slice(s,e+1))});
  }
  p.then(function(items){
    var got=validate(items,level);
    S.extra=(S.extra||[]).concat(got); resetQMap(); save();
    genCtl=null;
    var m=got.filter(function(q){return q.t==='m'}).length;
    toast('Lv'+level+' 새 문제 '+got.length+'개를 더했어요.');
    dash();
    var l=document.getElementById('genlog'); if(l)l.textContent='새 문제 '+got.length+'개(사지선다 '+m+' · 단답형 '+(got.length-m)+')를 더했어요.'+(got.length<30?' 형식이 맞지 않거나 겹치는 문제는 뺐어요.':'');
  },function(err){
    genCtl=null; go.disabled=!canGen(); stop.hidden=true;
    var c=err&&err.code, msg={cancelled:'멈췄어요.',not_granted:'Claude 사용을 허락하지 않아서 만들 수 없어요.',rate_limited:'Claude 사용량이 많아요. 잠시 뒤에 다시 눌러 주세요.',invalid_json:'답을 읽지 못했어요. 다시 눌러 주세요.',session_expired:'Claude에 다시 로그인해 주세요.',sampling_disabled:'이 계정에서는 Claude 문제 만들기를 쓸 수 없어요.',refused:'Claude가 이 요청을 거절했어요.'}[c];
    if(c==='api')msg='API 오류: '+err.message+'. 키를 확인해 주세요.';
    if(!msg&&err&&err.name==='AbortError')msg='멈췄어요.';
    if(!msg&&err&&err.name==='TypeError')msg='인터넷 연결을 확인해 주세요.';
    if(c==='not_granted'||c==='sampling_disabled'){claudeState='none'}
    log.textContent=msg||'문제를 만들지 못했어요. 잠시 뒤에 다시 눌러 주세요.';
  });
}

/* ---------- boot ---------- */
if(S.activeId&&stu())dash(); else home();
window.__GB={buildSet:buildSet,gradeSA:gradeSA,validate:validate,S:function(){return S},BUILTIN:BUILTIN,hintFor:hintFor,finishSet:finishSet,newStudent:newStudent,qById:qById};
})();
</script>
